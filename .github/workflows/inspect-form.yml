name: Inspect published quotation form

on:
  push:
    paths:
      - .github/workflows/inspect-form.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read public Google Form field map
        shell: bash
        run: |
          node <<'NODE'
          const url = 'https://docs.google.com/forms/d/e/1FAIpQLScP64ibl_RW72o1QOQr9q_LKEXH3UpVWrXDtYoL1vCDFNB9_w/viewform';
          const response = await fetch(url);
          const html = await response.text();
          if (!response.ok) throw new Error('Form request failed: ' + response.status);
          const marker = 'FB_PUBLIC_LOAD_DATA_ = ';
          const start = html.indexOf(marker);
          const end = html.indexOf(';</script>', start);
          if (start < 0 || end < 0) throw new Error('Google Form definition was not found');
          const data = JSON.parse(html.slice(start + marker.length, end));
          const fields = [];
          const walk = value => {
            if (!Array.isArray(value)) return;
            if (
              Number.isInteger(value[0]) &&
              typeof value[1] === 'string' &&
              Number.isInteger(value[3]) &&
              Array.isArray(value[4]) &&
              Number.isInteger(value[4]?.[0]?.[0])
            ) {
              fields.push({
                itemId: value[0],
                title: value[1],
                description: typeof value[2] === 'string' ? value[2] : '',
                type: value[3],
                entryId: value[4][0][0]
              });
            }
            for (const child of value) walk(child);
          };
          walk(data);
          const unique = [...new Map(fields.map(field => [field.itemId, field])).values()];
          console.log('FORM_FIELDS=' + JSON.stringify(unique));
          console.log('FORM_ACTION=https://docs.google.com/forms/d/e/1FAIpQLScP64ibl_RW72o1QOQr9q_LKEXH3UpVWrXDtYoL1vCDFNB9_w/formResponse');
          NODE
